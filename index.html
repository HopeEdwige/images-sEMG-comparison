    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

            transition: transform 0.05s linear;

        }
        #modal-img-container:active {

        }

                    </div>
                    <div class="p-4 flex-1 flex items-center justify-center bg-slate-100/50 cursor-pointer group" onclick="openModal('${img.url}', '${img.title}')" title="Cliquer pour zoomer">
                        <img src="${img.url}" alt="${img.title}" class="w-full h-auto max-h-[400px] object-contain rounded border border-slate-200 shadow-sm transition-transform group-hover:scale-[1.02] duration-300" onerror="this.src='https://placehold.co/600x400/f8fafc/334155?text=Image+non+disponible'">
                    </div>
                `;
                imageGrid.appendChild(card);
            });

            if (data.conclusion && data.conclusion.trim() !== "") {
                conclusionText.textContent = data.conclusion;
                conclusionBox.classList.remove('hidden');
            } else {
                conclusionBox.classList.add('hidden');
            }
            
            contentArea.scrollTop = 0;
        }

        loadScenario(scenarios[0].id, navMenu.children[0]);
    </script>

    <script>
        let currentZoom = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function openModal(url, title) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            const modalTitle = document.getElementById('modal-title');
            
            modalImg.src = url;
            modalTitle.textContent = title;
            resetZoom();
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
        }

        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.25, 5);
            updateImageTransform();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.25, 0.5);
            if (currentZoom === 1) { panX = 0; panY = 0; }
            updateImageTransform();
        }

        function resetZoom() {
            currentZoom = 1;
            panX = 0;
            panY = 0;
            updateImageTransform();
        }

        function updateImageTransform() {
            const modalImg = document.getElementById('modal-img');
            modalImg.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
            document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
        }

        // Mouse wheel zoom
        const modalContainer = document.getElementById('modal-img-container');
        if (modalContainer) {
            modalContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }, { passive: false });
        }

        // Drag to pan (Mouse & Touch support)
        const modalImg = document.getElementById('modal-img');

        function startDrag(clientX, clientY) {
            isDragging = true;
            startX = clientX - panX;
            startY = clientY - panY;
            
            // Désactiver la transition CSS pendant le glisser-déposer pour éviter l'effet de lag (ressort)
            if (modalImg) modalImg.style.transition = 'none';
        }

        function onDrag(clientX, clientY) {
            if (!isDragging) return;
            panX = clientX - startX;
            panY = clientY - startY;
            updateImageTransform();
        }

        function endDrag() {
            isDragging = false;
            // Réactiver la transition pour que le zoom à la molette reste fluide
            if (modalImg) modalImg.style.transition = '';
        }

        // On attache les événements au conteneur global (zone sombre) au lieu de l'image
        if (modalContainer) {
            // Mouse events
            modalContainer.addEventListener('mousedown', (e) => {
                startDrag(e.clientX, e.clientY);
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                onDrag(e.clientX, e.clientY);
            });

            window.addEventListener('mouseup', () => {
                endDrag();
            });

            // Touch events for mobile/tablets
            modalContainer.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    startDrag(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    onDrag(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });

            window.addEventListener('touchend', () => {
                endDrag();
            });
        }

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('image-modal');
            if (modal.classList.contains('hidden')) return;

            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === '+' || e.key === '=') {
                zoomIn();
            } else if (e.key === '-') {
                zoomOut();
            } else if (e.key === '0') {
                resetZoom();
            }
        });
    </script>

     <!-- Modale d'agrandissement d'image avec contrôles de zoom et déplacement -->

                    </button>
                </div>

                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>

                <img id="modal-img" src="" alt="Agrandissement" class="pannable-img max-w-full max-h-[70vh] object-contain select-none" draggable="false" onerror="this.src='https://placehold.co/800x600/1e293b/cbd5e1?text=Image+non+disponible'">
                <div class="absolute bottom-3 left-3 bg-slate-800/80 backdrop-blur text-white text-[11px] px-3 py-1 rounded-full pointer-events-none">
                    💡 Astuce : Utilisez les flèches ← → de votre clavier pour naviguer, glissez pour déplacer, ou la molette pour zoomer.
                </div>
            </div>
        </div>
    </div>
