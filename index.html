        function loadScenario(id, activeBtn) {
            Array.from(navMenu.children).forEach(btn => {
                btn.className = 'w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors duration-150 group flex items-center gap-3 text-slate-600 hover:bg-slate-100 hover:text-slate-900';

            if (activeBtn) {
                activeBtn.className = 'w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-colors duration-150 group flex items-center gap-3 bg-blue-50 text-blue-700';
                activeBtn.querySelector('span').className = 'w-1.5 h-1.5 rounded-full bg-blue-500';

            const data = scenarios.find(s => s.id === id);

            const contentArea = document.getElementById('content-area');

            void contentArea.offsetWidth;

            viewTitle.textContent = data.title;

            imageGrid.innerHTML = '';
            data.images.forEach(img => {
                const rawVariants = img.variants || { Normal: img.url };
                const variants = Object.fromEntries(Object.entries(rawVariants).map(([method, repetitions]) => [
                    method,
                    typeof repetitions === 'string' ? { rep1: repetitions } : repetitions
                ]));
                const methodNames = Object.keys(variants);
                let selectedMethod = methodNames[0];
                let selectedRep = Object.keys(variants[selectedMethod])[0];
                const initialUrl = variants[selectedMethod][selectedRep];
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col';
                card.innerHTML = `
                    <div class="p-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">

                            <button type="button" role="tab" aria-selected="${index === 0}" data-method="${method}" class="method-tab px-3 py-1.5 text-xs font-semibold border-b-2 ${index === 0 ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-700'}">
                                ${method}
                            </button>
                        `).join('')}
                    </div>` : ''}
                    ${Object.keys(variants[selectedMethod]).length > 1 ? `
                    <div class="flex gap-1 px-4 pt-2 bg-slate-100/50" role="tablist" aria-label="Répétitions de ${img.title}">
                        ${Object.keys(variants[selectedMethod]).map((rep, index) => `
                            <button type="button" role="tab" aria-selected="${index === 0}" data-rep="${rep}" class="rep-tab px-3 py-1.5 text-xs font-semibold border-b-2 ${index === 0 ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-700'}">
                                ${rep}
                            </button>
                        `).join('')}
                    </div>` : ''}
                    <div class="p-4 flex-1 flex items-center justify-center bg-slate-100/50 cursor-pointer group" title="Cliquer pour zoomer">
                        <img src="${initialUrl}" alt="${img.title}" class="w-full h-auto max-h-[400px] object-contain rounded border border-slate-200 shadow-sm transition-transform group-hover:scale-[1.02] duration-300" onerror="this.src='https://placehold.co/600x400/f8fafc/334155?text=Image+non+disponible'">
                    </div>
                `;
                const image = card.querySelector('img');
                const imageContainer = image.parentElement;
                imageContainer.onclick = () => openModal(image.src, img.title);

                const updateVariantImage = () => {
                    image.src = variants[selectedMethod][selectedRep];
                    card.querySelectorAll('.method-tab').forEach(tab => {
                        const isActive = tab.dataset.method === selectedMethod;
                        tab.setAttribute('aria-selected', isActive);
                        tab.className = `method-tab px-3 py-1.5 text-xs font-semibold border-b-2 ${isActive ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`;
                    });
                    card.querySelectorAll('.rep-tab').forEach(tab => {
                        const isActive = tab.dataset.rep === selectedRep;
                        tab.setAttribute('aria-selected', isActive);
                        tab.className = `rep-tab px-3 py-1.5 text-xs font-semibold border-b-2 ${isActive ? 'border-blue-600 text-blue-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`;
                    });
                };

                card.querySelectorAll('.method-tab').forEach(tab => {
                    tab.onclick = () => {
                        selectedMethod = tab.dataset.method;
                        if (!variants[selectedMethod][selectedRep]) {
                            selectedRep = Object.keys(variants[selectedMethod])[0];
                        }
                        updateVariantImage();
                    };
                });

                card.querySelectorAll('.rep-tab').forEach(tab => {
                    tab.onclick = () => {
                        selectedRep = tab.dataset.rep;
                        updateVariantImage();
                    };
                });
                imageGrid.appendChild(card);
            });

            if (data.conclusion && data.conclusion.trim() !== "") {
                conclusionText.textContent = data.conclusion;
                conclusionBox.classList.remove('hidden');
            } else {
                conclusionBox.classList.add('hidden');
            }
            
            contentArea.scrollTop = 0;
        }

        loadScenario(scenarios[0].id, navMenu.children[0]);
    </script>

    <script>
        let currentZoom = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let modalImages = [];
        let currentImageIndex = 0;

        function openModal(url, title) {
            const modal = document.getElementById('image-modal');
            modalImages = Array.from(document.querySelectorAll('#image-grid img')).map(image => ({
                url: image.src,
                title: image.alt
            }));
            currentImageIndex = modalImages.findIndex(image => image.url === url);
            if (currentImageIndex < 0) {
                currentImageIndex = 0;
                modalImages = [{ url, title }];
            }
            showModalImage();
            resetZoom();
            modal.classList.remove('hidden');
        }

        function showModalImage() {
            const image = modalImages[currentImageIndex];
            if (!image) return;

            document.getElementById('modal-img').src = image.url;
            document.getElementById('modal-title').textContent = image.title;
            document.getElementById('modal-counter').textContent = `${currentImageIndex + 1} / ${modalImages.length}`;
        }

        function previousImage() {
            if (modalImages.length < 2) return;
            currentImageIndex = (currentImageIndex - 1 + modalImages.length) % modalImages.length;
            showModalImage();
            resetZoom();
        }

        function nextImage() {
            if (modalImages.length < 2) return;
            currentImageIndex = (currentImageIndex + 1) % modalImages.length;
            showModalImage();
            resetZoom();
        }

        function prevImage() {
            previousImage();
        }

        function closeModal() {
            const modal = document.getElementById('image-modal');
            modal.classList.add('hidden');
        }

        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.25, 5);
            updateImageTransform();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.25, 0.5);
            if (currentZoom === 1) { panX = 0; panY = 0; }
            updateImageTransform();
        }

        function resetZoom() {
            currentZoom = 1;
            panX = 0;
            panY = 0;
            updateImageTransform();
        }

        function updateImageTransform() {
            const modalImg = document.getElementById('modal-img');
            const zoomLevel = document.getElementById('zoom-level');
            if (!modalImg || !zoomLevel) return;
            modalImg.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
            zoomLevel.textContent = Math.round(currentZoom * 100) + '%';
        }

        function initializeModalInteractions() {
            const modalContainer = document.getElementById('modal-img-container');
            const modalImg = document.getElementById('modal-img');
            if (!modalContainer || !modalImg) return;

            modalContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }, { passive: false });

            modalContainer.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
                modalImg.style.transition = 'none';
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateImageTransform();
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                modalImg.style.transition = '';
            });

            modalContainer.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    startX = e.touches[0].clientX - panX;
                    startY = e.touches[0].clientY - panY;
                    modalImg.style.transition = 'none';
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || e.touches.length !== 1) return;
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateImageTransform();
            }, { passive: false });

            window.addEventListener('touchend', () => {
                isDragging = false;
                modalImg.style.transition = '';
            });
        }

        document.addEventListener('DOMContentLoaded', initializeModalInteractions);

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('image-modal');
            if (modal.classList.contains('hidden')) return;

            if (e.key === 'Escape') {
                closeModal();
            } else if (e.key === '+' || e.key === '=') {
                zoomIn();
            } else if (e.key === '-') {
                zoomOut();
            } else if (e.key === '0') {
                resetZoom();
            } else if (e.key === 'ArrowLeft') {
                previousImage();
            } else if (e.key === 'ArrowRight') {
                nextImage();
            }
        });
    </script>

     <!-- Modale d'agrandissement d'image avec contrôles de zoom et déplacement -->

                    <button onclick="resetZoom()" class="p-1.5 rounded-lg text-slate-600 hover:bg-slate-100 transition-colors text-xs font-medium px-2" title="Réinitialiser le zoom (0)">
                    Réinitialiser
                    </button>
                    <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors ml-2" title="Fermer (Échap)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div id="modal-img-container" class="relative flex-1 overflow-hidden flex items-center justify-center bg-slate-900 rounded-xl mt-3 min-h-[500px]">
                <!-- Boutons de navigation Flèches Précédent / Suivant -->
                <button onclick="prevImage(); event.stopPropagation();" class="absolute left-4 z-20 bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full backdrop-blur transition-all shadow-lg hover:scale-110 flex items-center justify-center" title="Image précédente (Flèche gauche)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button onclick="nextImage(); event.stopPropagation();" class="absolute right-4 z-20 bg-slate-800/80 hover:bg-slate-700 text-white p-3 rounded-full backdrop-blur transition-all shadow-lg hover:scale-110 flex items-center justify-center" title="Image suivante (Flèche droite)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>

                <img id="modal-img" src="" alt="Agrandissement" class="pannable-img max-w-full max-h-[70vh] object-contain select-none" draggable="false" onerror="this.src='https://placehold.co/800x600/1e293b/cbd5e1?text=Image+non+disponible'">
                <div class="absolute bottom-3 left-3 bg-slate-800/80 backdrop-blur text-white text-[11px] px-3 py-1 rounded-full pointer-events-none">
                    💡 Astuce : Utilisez les flèches ← → de votre clavier pour naviguer, glissez pour déplacer, ou la molette pour zoomer.
                </div>
            </div>
        </div>
    </div>
